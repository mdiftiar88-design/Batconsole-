<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Batconsole Dashboard Ultra</title>

  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Monetag Rewarded Interstitial SDK -->
  <script src='//libtl.com/sdk.js' data-zone='11477768' data-sdk='show_11477768'></script>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #030712;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Glow Background Spheres */
    body::before {
      content: '';
      position: absolute;
      top: 10%;
      left: 10%;
      width: 200px;
      height: 200px;
      background: rgba(99, 102, 241, 0.25);
      filter: blur(80px);
      border-radius: 50%;
      z-index: 0;
    }

    body::after {
      content: '';
      position: absolute;
      bottom: 10%;
      right: 10%;
      width: 220px;
      height: 220px;
      background: rgba(34, 197, 94, 0.2);
      filter: blur(80px);
      border-radius: 50%;
      z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
      z-index: 1;
    }

    /* --- 🔴 Red Marked Card (Ultra Glassmorphism) --- */
    .balance-card {
      background: rgba(17, 24, 39, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(255, 255, 255, 0.03);
      transition: all 0.3s ease;
    }

    .balance-title {
      color: #9ca3af;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .balance-amount {
      font-size: 2.5rem;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -0.5px;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
      transition: all 0.3s ease;
    }

    /* Glow animation on balance update */
    .balance-amount.pulse {
      color: #4ade80;
      text-shadow: 0 0 25px rgba(74, 222, 128, 0.8);
      transform: scale(1.03);
    }

    .today-earned-badge {
      align-self: flex-start;
      background: linear-gradient(135deg, rgba(34, 197, 94, 0.15), rgba(16, 185, 129, 0.05));
      border: 1px solid rgba(34, 197, 94, 0.4);
      color: #4ade80;
      font-size: 0.75rem;
      padding: 5px 12px;
      border-radius: 20px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.15);
    }

    /* --- 🟡 Yellow Marked Section (Ads Count) --- */
    .ad-card {
      background: rgba(17, 24, 39, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .left-section {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
    }

    .tv-icon-box {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.25), rgba(59, 130, 246, 0.15));
      border: 1px solid rgba(99, 102, 241, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      color: #818cf8;
      flex-shrink: 0;
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.2);
    }

    .info-box {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .title-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .main-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: #ffffff;
    }

    .live-badge {
      background: rgba(99, 102, 241, 0.25);
      border: 1px solid rgba(129, 140, 248, 0.4);
      color: #a5b4fc;
      font-size: 0.6rem;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 4px;
      animation: pulseGlow 2s infinite alternate;
    }

    @keyframes pulseGlow {
      0% { opacity: 0.7; }
      100% { opacity: 1; box-shadow: 0 0 8px rgba(129, 140, 248, 0.6); }
    }

    .sub-title {
      font-size: 0.82rem;
      color: #9ca3af;
      font-weight: 500;
    }

    /* Auto Start Button */
    .auto-btn {
      background: linear-gradient(135deg, #6366f1 0%, #3b82f6 100%);
      color: #ffffff;
      border: none;
      padding: 12px 22px;
      border-radius: 30px;
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
      transition: all 0.2s ease;
      letter-spacing: 0.3px;
    }

    .auto-btn.running {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
    }

    .auto-btn:active {
      transform: scale(0.95);
    }

    /* Progress Bar */
    .progress-container {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #6366f1, #3b82f6, #10b981);
      background-size: 200% 100%;
      animation: gradientMove 2s linear infinite;
      border-radius: 10px;
      transition: width 0.4s ease;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      color: #6b7280;
      font-weight: 700;
    }

    /* Bonus Offer Button (Glowing Effect) */
    .bonus-btn {
      width: 100%;
      background: linear-gradient(90deg, #f59e0b 0%, #d97706 100%);
      color: #000;
      border: none;
      border-radius: 30px;
      padding: 18px 20px;
      font-size: 1rem;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 0 25px rgba(245, 158, 11, 0.4);
      transition: all 0.2s ease;
      animation: floatGlow 3s ease-in-out infinite alternate;
    }

    @keyframes floatGlow {
      0% { box-shadow: 0 0 15px rgba(245, 158, 11, 0.3); }
      100% { box-shadow: 0 0 30px rgba(245, 158, 11, 0.7); }
    }

    .bonus-btn:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- 🔴 1. Balance Card -->
    <div class="balance-card">
      <div class="balance-title">
        <i class="fa-solid fa-wallet"></i> বর্তমান ব্যালেন্স
      </div>
      <div class="balance-amount" id="balance-box">
        ৳ <span id="main-balance">0.00</span>
      </div>
      <div class="today-earned-badge">
        <i class="fa-solid fa-chart-line"></i> +৳<span id="today-balance">0.00</span> আজ
      </div>
    </div>

    <!-- 🟡 2. Ad Player Card -->
    <div class="ad-card">
      <div class="card-top">
        <div class="left-section">
          <div class="tv-icon-box">
            <i class="fa-solid fa-tv"></i>
          </div>
          <div class="info-box">
            <div class="title-row">
              <span class="main-title">বিজ্ঞাপন দেখুন</span>
              <span class="live-badge"><i class="fa-solid fa-bolt"></i> LIVE</span>
            </div>
            <div class="sub-title">মোট সম্পন্ন: <span id="completed-ads" style="color: #fff; font-weight: 800;">0</span> টি</div>
          </div>
        </div>

        <button class="auto-btn" id="auto-btn" onclick="toggleAutoAds()">অটো স্টার্ট</button>
      </div>

      <!-- Progress Bar -->
      <div class="progress-container">
        <div class="progress-fill" id="progress-bar"></div>
      </div>

      <div class="card-footer">
        <span style="color: #9ca3af;">∞ আনলিমিটেড এড</span>
        <span id="status-text">স্টপড</span>
      </div>
    </div>

    <!-- 3. Direct Link Button -->
    <button class="bonus-btn" onclick="openDirectLink()">
      🚀 🔥 Bonus Offer (Direct Ad)
    </button>

  </div>

  <script>
    const DIRECT_LINK_URL = "https://omg10.com/4/11467098";
    const REWARD_PER_AD = 10;
    const AUTO_DELAY_MS = 2000;

    let tg = null;
    if (window.Telegram && window.Telegram.WebApp) {
      tg = window.Telegram.WebApp;
      tg.ready();
      tg.expand();
    }

    // Play Soft Beep FX Sound
    function playBeepSound() {
      try {
        let ctx = new (window.AudioContext || window.webkitAudioContext)();
        let osc = ctx.createOscillator();
        let gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(600, ctx.currentTime);
        gain.gain.setValueAtTime(0.03, ctx.currentTime);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.1);
      } catch(e) {}
    }

    let balance = parseFloat(localStorage.getItem('user_balance')) || 0;
    let todayEarned = parseFloat(localStorage.getItem('today_earned')) || 0;
    let completedAds = parseInt(localStorage.getItem('completed_ads')) || 0;

    let isRunning = false;
    let autoTimer = null;

    updateUI();

    function updateUI() {
      document.getElementById('main-balance').innerText = balance.toFixed(2);
      document.getElementById('today-balance').innerText = todayEarned.toFixed(2);
      document.getElementById('completed-ads').innerText = completedAds;

      let progress = (completedAds % 10) * 10;
      if (completedAds > 0 && progress === 0) progress = 100;
      document.getElementById('progress-bar').style.width = progress + '%';

      localStorage.setItem('user_balance', balance);
      localStorage.setItem('today_earned', todayEarned);
      localStorage.setItem('completed_ads', completedAds);
    }

    function addReward() {
      balance += REWARD_PER_AD;
      todayEarned += REWARD_PER_AD;
      completedAds += 1;
      
      // Pulse Animation on Balance
      let balanceBox = document.getElementById('balance-box');
      balanceBox.classList.add('pulse');
      setTimeout(() => balanceBox.classList.remove('pulse'), 400);

      updateUI();
    }

    function toggleAutoAds() {
      playBeepSound();
      const btn = document.getElementById('auto-btn');
      const status = document.getElementById('status-text');

      if (!isRunning) {
        isRunning = true;
        btn.innerText = "স্টপ";
        btn.classList.add('running');
        status.innerText = "রানিং ⚡";
        status.style.color = "#3b82f6";

        runAutoLoop();
      } else {
        stopAutoAds();
      }
    }

    function stopAutoAds() {
      isRunning = false;
      clearTimeout(autoTimer);
      const btn = document.getElementById('auto-btn');
      const status = document.getElementById('status-text');
      
      btn.innerText = "অটো স্টার্ট";
      btn.classList.remove('running');
      status.innerText = "স্টপড";
      status.style.color = "#6b7280";
    }

    function runAutoLoop() {
      if (!isRunning) return;

      if (typeof show_11477768 === 'function') {
        show_11477768().then(() => {
          addReward();
          scheduleNextAd();
        }).catch((err) => {
          console.log("Ad Error / Closed:", err);
          addReward();
          scheduleNextAd();
        });
      } else {
        scheduleNextAd(3000);
      }
    }

    function scheduleNextAd(customDelay) {
      if (isRunning) {
        autoTimer = setTimeout(runAutoLoop, customDelay || AUTO_DELAY_MS);
      }
    }

    function openDirectLink() {
      playBeepSound();
      if (DIRECT_LINK_URL) {
        if (tg && tg.openLink) {
          tg.openLink(DIRECT_LINK_URL);
        } else {
          window.open(DIRECT_LINK_URL, '_blank');
        }
      }
    }
  </script>
</body>
</html>
