<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  
  <title>MARVEL U.C.M. S.H.I.E.L.D. Terminal</title>

  <!-- Telegram SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Monetag SDK -->
  <script src='//libtl.com/sdk.js' data-zone='11477768' data-sdk='show_11477768'></script>

  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Rajdhani', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #08070c;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 14px;
      overflow-x: hidden;
      position: relative;
    }

    /* 3D Arc Reactor Ambient Background */
    body::before {
      content: '';
      position: absolute;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(225, 29, 72, 0.35) 0%, rgba(0,0,0,0) 70%);
      top: 5%;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 50%;
      z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
      z-index: 1;
    }

    /* Pop-up Comic Text */
    .comic-pop {
      position: absolute;
      top: 35%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      font-family: 'Bangers', cursive;
      font-size: 3.2rem;
      color: #facc15;
      text-shadow: 4px 4px 0 #e11d48, -3px -3px 0 #000;
      pointer-events: none;
      z-index: 100;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.2s ease;
      opacity: 0;
    }

    .comic-pop.active {
      transform: translate(-50%, -50%) scale(1.3) rotate(-8deg);
      opacity: 1;
    }

    /* --- 3D Glass Profile Card --- */
    .profile-card {
      background: rgba(22, 22, 35, 0.75);
      backdrop-filter: blur(12px);
      border: 1.5px solid rgba(225, 29, 72, 0.6);
      border-radius: 22px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.2);
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar-box {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: 2px solid #facc15;
      overflow: hidden;
      background: #181824;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(250, 204, 21, 0.4), inset 0 0 8px rgba(0,0,0,0.8);
      transition: transform 0.2s;
    }
    
    .avatar-box:active {
      transform: scale(0.93);
    }

    .avatar-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .user-details h3 {
      font-size: 1.1rem;
      font-weight: 800;
      color: #fff;
    }

    .hero-level-tag {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.68rem;
      color: #facc15;
      font-weight: 900;
      background: rgba(250, 204, 21, 0.12);
      padding: 3px 8px;
      border-radius: 8px;
      border: 1px solid rgba(250, 204, 21, 0.3);
      display: inline-block;
      margin-top: 3px;
    }

    .terminal-status {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.65rem;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.4);
      padding: 6px 10px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
    }

    /* --- 3D Balance Card --- */
    .balance-card {
      background: rgba(22, 22, 35, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 22px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.15);
    }

    .balance-title {
      color: #9ca3af;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
    }

    .balance-amount {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.4rem;
      font-weight: 900;
      color: #facc15;
      text-shadow: 0 4px 15px rgba(250, 204, 21, 0.35);
    }

    .today-badge {
      align-self: flex-start;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid #22c55e;
      color: #4ade80;
      font-size: 0.8rem;
      padding: 4px 12px;
      border-radius: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.2);
    }

    /* --- 3D Infinity Stones Grid --- */
    .stones-card {
      background: rgba(22, 22, 35, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 22px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .stones-title {
      font-size: 0.88rem;
      font-weight: 800;
      color: #c084fc;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .stones-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
    }

    .stone-icon {
      aspect-ratio: 1;
      border-radius: 12px;
      background: #12121c;
      border: 1.5px dashed rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      opacity: 0.25;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .stone-icon.active {
      opacity: 1;
      border-style: solid;
      box-shadow: 0 0 15px currentColor, inset 0 0 8px currentColor;
      transform: translateY(-2px) scale(1.08);
    }

    /* --- 3D Mission Card --- */
    .ad-card {
      background: rgba(22, 22, 35, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 22px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .left-section {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }

    .reactor-box {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: radial-gradient(circle, #38bdf8 0%, #0369a1 100%);
      border: 2px solid #38bdf8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      color: #fff;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.7);
      animation: reactorGlow 2s infinite alternate;
    }

    @keyframes reactorGlow {
      0% { box-shadow: 0 0 8px rgba(56, 189, 248, 0.4); transform: scale(0.98); }
      100% { box-shadow: 0 0 22px rgba(56, 189, 248, 1); transform: scale(1.03); }
    }

    .info-box {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .main-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: #ffffff;
    }

    .sub-title {
      font-size: 0.85rem;
      color: #9ca3af;
      font-weight: 600;
    }

    .auto-btn {
      background: linear-gradient(135deg, #e11d48 0%, #9f1239 100%);
      color: #ffffff;
      border: 1px solid #fecdd3;
      padding: 12px 20px;
      border-radius: 25px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(225, 29, 72, 0.4);
      transition: all 0.2s ease;
    }

    .auto-btn:active {
      transform: scale(0.95);
    }

    .auto-btn.running {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      box-shadow: 0 6px 15px rgba(56, 189, 248, 0.5);
      border-color: #38bdf8;
    }

    .progress-container {
      width: 100%;
      height: 8px;
      background: #12121c;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #e11d48, #facc15, #22c55e, #38bdf8);
      border-radius: 10px;
      transition: width 0.3s ease;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      color: #6b7280;
      font-weight: 700;
    }

    /* 3D Bonus Button */
    .bonus-btn {
      width: 100%;
      background: linear-gradient(180deg, #fde047 0%, #ca8a04 100%);
      color: #000;
      border: 1px solid #fef08a;
      border-radius: 25px;
      padding: 16px 20px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 8px 25px rgba(250, 204, 21, 0.4), inset 0 2px 2px rgba(255, 255, 255, 0.8);
      transition: all 0.2s ease;
    }

    .bonus-btn:active {
      transform: translateY(2px) scale(0.97);
      box-shadow: 0 3px 10px rgba(250, 204, 21, 0.3);
    }

    /* Avatar Selector Modal */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: #12121c;
      border: 2px solid #facc15;
      padding: 22px;
      border-radius: 24px;
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      text-align: center;
      box-shadow: 0 0 30px rgba(250, 204, 21, 0.3);
    }
    .avatar-options {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .opt-avatar {
      background: #1a1a2e;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 12px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transition: transform 0.2s;
    }
    .opt-avatar:hover { transform: scale(1.05); }
    .opt-avatar img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
    .opt-avatar span { font-size: 0.8rem; font-weight: bold; }
  </style>
</head>
<body>

  <div class="comic-pop" id="comic-pop">BAM! +৳10</div>

  <!-- Hero Avatar Selection Modal -->
  <div class="modal" id="avatar-modal">
    <div class="modal-content">
      <h3 style="color: #facc15; font-family: 'Orbitron'; font-size: 1rem;">SELECT HERO AVATAR</h3>
      <div class="avatar-options">
        <div class="opt-avatar" onclick="setHeroAvatar('Spider-Man', 'https://api.dicebear.com/7.x/bottts/svg?seed=SpiderMan')">
          <img src="https://api.dicebear.com/7.x/bottts/svg?seed=SpiderMan" alt="Spider-Man">
          <span>Spider-Man</span>
        </div>
        <div class="opt-avatar" onclick="setHeroAvatar('Captain America', 'https://api.dicebear.com/7.x/bottts/svg?seed=Cap')">
          <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Cap" alt="Cap">
          <span>Captain America</span>
        </div>
        <div class="opt-avatar" onclick="setHeroAvatar('Thor', 'https://api.dicebear.com/7.x/bottts/svg?seed=Thor')">
          <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Thor" alt="Thor">
          <span>Thor</span>
        </div>
        <div class="opt-avatar" onclick="setHeroAvatar('Iron Man', 'https://api.dicebear.com/7.x/bottts/svg?seed=IronMan')">
          <img src="https://api.dicebear.com/7.x/bottts/svg?seed=IronMan" alt="Iron Man">
          <span>Iron Man</span>
        </div>
      </div>
      <button onclick="toggleModal(false)" style="background:#e11d48; color:#fff; border:none; padding:10px; border-radius:15px; font-weight:bold; cursor:pointer;">CLOSE</button>
    </div>
  </div>

  <div class="container">

    <!-- Profile Header -->
    <div class="profile-card">
      <div class="user-info">
        <div class="avatar-box" onclick="toggleModal(true)">
          <img id="user-avatar-img" src="https://api.dicebear.com/7.x/bottts/svg?seed=IronMan" alt="Hero">
        </div>
        <div class="user-details">
          <h3 id="hero-name-text">Iron Man</h3>
          <div class="hero-level-tag" id="hero-rank">LEVEL 1: SPIDER-MAN</div>
        </div>
      </div>
      <div class="terminal-status">
        <i class="fa-solid fa-shield-halved"></i> SECURE
      </div>
    </div>

    <!-- JARVIS HUD Balance Card -->
    <div class="balance-card">
      <div class="balance-title">
        <i class="fa-solid fa-wallet"></i> STARK HUD BALANCE
      </div>
      <div class="balance-amount">
        ৳ <span id="main-balance">0.00</span>
      </div>
      <div class="today-badge">
        <i class="fa-solid fa-bolt"></i> +৳<span id="today-balance">0.00</span> TODAY
      </div>
    </div>

    <!-- Infinity Stones Box -->
    <div class="stones-card">
      <div class="stones-title">
        <span><i class="fa-solid fa-gem"></i> INFINITY STONES</span>
        <span id="stones-count" style="font-family: 'Orbitron'; font-size: 0.75rem;">0 / 6</span>
      </div>
      <div class="stones-grid">
        <div class="stone-icon" id="stone-0" style="color: #ef4444;" title="Power Stone"><i class="fa-solid fa-gem"></i></div>
        <div class="stone-icon" id="stone-1" style="color: #22c55e;" title="Time Stone"><i class="fa-solid fa-gem"></i></div>
        <div class="stone-icon" id="stone-2" style="color: #38bdf8;" title="Space Stone"><i class="fa-solid fa-gem"></i></div>
        <div class="stone-icon" id="stone-3" style="color: #facc15;" title="Reality Stone"><i class="fa-solid fa-gem"></i></div>
        <div class="stone-icon" id="stone-4" style="color: #f97316;" title="Soul Stone"><i class="fa-solid fa-gem"></i></div>
        <div class="stone-icon" id="stone-5" style="color: #a855f7;" title="Mind Stone"><i class="fa-solid fa-gem"></i></div>
      </div>
    </div>

    <!-- Avengers Mission Card -->
    <div class="ad-card">
      <div class="card-top">
        <div class="left-section">
          <div class="reactor-box">
            <i class="fa-solid fa-atom"></i>
          </div>
          <div class="info-box">
            <span class="main-title">WATCH ADVERTISEMENTS</span>
            <div class="sub-title">COMPLETED: <span id="completed-ads" style="color:#facc15; font-weight:bold;">0</span> MISSION(S)</div>
          </div>
        </div>

        <button class="auto-btn" id="auto-btn" onclick="toggleAutoAds()">JARVIS AUTO</button>
      </div>

      <div class="progress-container">
        <div class="progress-fill" id="progress-bar"></div>
      </div>

      <div class="card-footer">
        <span>U.C.M. PROTOCOL</span>
        <span id="status-text" style="color: #6b7280;">STANDBY</span>
      </div>
    </div>

    <!-- Direct Ad Button -->
    <button class="bonus-btn" onclick="openDirectLink()">
      🚀 🔥 THANOS SNAP BONUS (DIRECT AD)
    </button>

  </div>

  <script>
    const DIRECT_LINK_URL = "https://omg10.com/4/11467098";
    const REWARD_PER_AD = 10;
    const AUTO_DELAY_MS = 3500;

    let tg = null;
    if (window.Telegram && window.Telegram.WebApp) {
      tg = window.Telegram.WebApp;
      tg.ready();
      tg.expand();
    }

    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playMarvelSound(type) {
      try {
        initAudio();
        if (!audioCtx) return;

        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        
        if (type === 'thor') {
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(300, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.2);
        } else {
          osc.type = "sine";
          osc.frequency.setValueAtTime(500, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.15);
        }

        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.2);
      } catch(e) {}
    }

    // Load Saved State
    let completedAds = parseInt(localStorage.getItem('completed_ads')) || 0;
    let balance = completedAds * REWARD_PER_AD; // 10 Tk per ad exact sync
    let todayEarned = balance;
    let heroName = localStorage.getItem('hero_name') || "Iron Man";
    let heroAvatar = localStorage.getItem('hero_avatar') || "https://api.dicebear.com/7.x/bottts/svg?seed=IronMan";

    let isRunning = false;
    let autoTimer = null;

    document.getElementById('hero-name-text').innerText = heroName;
    document.getElementById('user-avatar-img').src = heroAvatar;
    updateUI();

    function toggleModal(show) {
      document.getElementById('avatar-modal').classList.toggle('active', show);
    }

    function setHeroAvatar(name, imgUrl) {
      heroName = name;
      heroAvatar = imgUrl;
      document.getElementById('hero-name-text').innerText = heroName;
      document.getElementById('user-avatar-img').src = heroAvatar;
      localStorage.setItem('hero_name', heroName);
      localStorage.setItem('hero_avatar', heroAvatar);
      toggleModal(false);
    }

    function updateUI() {
      balance = completedAds * REWARD_PER_AD;
      todayEarned = balance;

      document.getElementById('main-balance').innerText = balance.toFixed(2);
      document.getElementById('today-balance').innerText = todayEarned.toFixed(2);
      document.getElementById('completed-ads').innerText = completedAds;

      // Level System
      let rankText = "LEVEL 1: PETER PARKER (SPIDER-MAN)";
      if (completedAds >= 30) rankText = "LEVEL 4: TONY STARK (IRON MAN 🤖)";
      else if (completedAds >= 15) rankText = "LEVEL 3: THOR ODINSON ⚡";
      else if (completedAds >= 5) rankText = "LEVEL 2: STEVE ROGERS (CAP 🛡️)";
      document.getElementById('hero-rank').innerText = rankText;

      // Infinity Stones Logic (0 to 6)
      let activeStonesCount = completedAds % 6;
      if (completedAds > 0 && activeStonesCount === 0) activeStonesCount = 6;
      
      for (let i = 0; i < 6; i++) {
        let stone = document.getElementById(`stone-${i}`);
        if (i < activeStonesCount) {
          stone.classList.add('active');
        } else {
          stone.classList.remove('active');
        }
      }
      document.getElementById('stones-count').innerText = `${activeStonesCount} / 6`;

      // Progress bar fill
      let progress = (completedAds % 10) * 10;
      if (completedAds > 0 && progress === 0) progress = 100;
      document.getElementById('progress-bar').style.width = progress + '%';

      localStorage.setItem('completed_ads', completedAds);
    }

    function showComicPop() {
      let pop = document.getElementById('comic-pop');
      const words = ["BAM! +৳10", "POW! +৳10", "ZAP! +৳10", "BOOM! +৳10", "SMASH! +৳10"];
      pop.innerText = words[Math.floor(Math.random() * words.length)];
      pop.classList.add('active');
      setTimeout(() => pop.classList.remove('active'), 500);
    }

    function addReward() {
      completedAds += 1;
      playMarvelSound(completedAds % 2 === 0 ? 'thor' : 'shield');
      showComicPop();
      updateUI();
    }

    function toggleAutoAds() {
      initAudio();
      const btn = document.getElementById('auto-btn');
      const status = document.getElementById('status-text');

      if (!isRunning) {
        isRunning = true;
        btn.innerText = "ABORT";
        btn.classList.add('running');
        status.innerText = "JARVIS ACTIVE ⚡";
        status.style.color = "#38bdf8";
        runAutoLoop();
      } else {
        stopAutoAds();
      }
    }

    function stopAutoAds() {
      isRunning = false;
      if (autoTimer) clearTimeout(autoTimer);
      const btn = document.getElementById('auto-btn');
      const status = document.getElementById('status-text');
      
      btn.innerText = "JARVIS AUTO";
      btn.classList.remove('running');
      status.innerText = "STANDBY";
      status.style.color = "#6b7280";
    }

    async function runAutoLoop() {
      if (!isRunning) return;

      if (typeof show_11477768 === 'function') {
        try {
          await show_11477768();
          addReward();
        } catch (e) {
          console.warn("Ad skip/fail:", e);
        }
      } else {
        addReward();
      }

      if (isRunning) {
        autoTimer = setTimeout(runAutoLoop, AUTO_DELAY_MS);
      }
    }

    function openDirectLink() {
      initAudio();
      playMarvelSound('thor');
      if (DIRECT_LINK_URL) {
