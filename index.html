<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Gotham Bat-Console</title>

  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Monetag SDK -->
  <script src='//libtl.com/sdk.js' data-zone='11477768' data-sdk='show_11477768'></script>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #030712;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 400px;
    }

    /* --- EXACT MATCH UI CARD --- */
    .ad-card {
      background: linear-gradient(135deg, #0d0b27 0%, #080619 100%);
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(124, 58, 237, 0.15);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .left-section {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }

    .tv-icon-box {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.3), rgba(168, 85, 247, 0.2));
      border: 1px solid rgba(168, 85, 247, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      color: #a7f3d0;
      flex-shrink: 0;
    }

    .info-box {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .title-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .main-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #ffffff;
    }

    .live-badge {
      background: rgba(139, 92, 246, 0.2);
      border: 1px solid rgba(168, 85, 247, 0.5);
      color: #c084fc;
      font-size: 0.65rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 4px;
      letter-spacing: 0.5px;
    }

    .sub-title {
      font-size: 0.85rem;
      color: #94a3b8;
      font-weight: 500;
    }

    /* Gradient Action Button */
    .watch-btn {
      background: linear-gradient(90deg, #8b5cf6 0%, #06b6d4 100%);
      color: #ffffff;
      border: none;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(6, 182, 212, 0.3);
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .watch-btn:active {
      transform: scale(0.95);
    }

    /* Progress Bar */
    .progress-container {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #a855f7, #06b6d4);
      border-radius: 10px;
      transition: width 0.4s ease;
    }

    .bottom-info {
      text-align: right;
      font-size: 0.8rem;
      color: #64748b;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="ad-card">
      <div class="card-top">
        <div class="left-section">
          <div class="tv-icon-box">
            <i class="fa-solid fa-tv"></i>
          </div>
          <div class="info-box">
            <div class="title-row">
              <span class="main-title">বিজ্ঞাপন দেখুন</span>
              <span class="live-badge"><i class="fa-solid fa-bolt"></i> LIVE</span>
            </div>
            <div class="sub-title"><span id="completed-count">0</span> টি দেখা হয়েছে</div>
          </div>
        </div>

        <!-- Watch Button -->
        <button class="watch-btn" onclick="watchAdManual()">
          <i class="fa-solid fa-tv"></i> দেখুন
        </button>
      </div>

      <!-- Animated Progress Bar -->
      <div class="progress-container">
        <div class="progress-fill" id="progress-bar"></div>
      </div>

      <div class="bottom-info">
        অনলিমিটেড সুযোগ চালু আছে ✨
      </div>
    </div>
  </div>

  <script>
    // Telegram Integration
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    let adCount = parseInt(localStorage.getItem('unlimited_ad_count')) || 0;
    updateUI();

    function watchAdManual() {
      if (typeof show_11477768 === 'function') {
        show_11477768().then(() => {
          adCount++;
          localStorage.setItem('unlimited_ad_count', adCount);
          updateUI();
        }).catch((err) => {
          console.log("Ad Closed / Error:", err);
          // টেস্ট করার জন্য বা ব্যর্থ হলেও অ্যাড কাউন্ট বাড়াতে চাইলে নিচের লাইন দুটো আনকমেন্ট করতে পারিস:
          // adCount++;
          // updateUI();
        });
      } else {
        alert("SDK এখনও লোড হয়নি, কিছুক্ষণ পর চেষ্টা করুন।");
      }
    }

    function updateUI() {
      document.getElementById('completed-count').innerText = adCount;
      
      // প্রোগ্রেস বার প্রতিটি ১০টি অ্যাডের সাইকেলে এনিমেট হবে
      let progressPercent = (adCount % 10) * 10;
      if (adCount > 0 && progressPercent === 0) progressPercent = 100;
      document.getElementById('progress-bar').style.width = progressPercent + '%';
    }
  </script>
</body>
</html>
